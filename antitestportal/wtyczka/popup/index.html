<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 340px;
            background: #08080a;
            color: #e2e8f0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 15px;
            margin: 0;
        }

        .panel {
            border: 1px solid #1e293b;
            border-radius: 12px;
            background: #0f172a;
            padding: 15px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        .neon-text {
            color: #38bdf8;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
            font-weight: 800;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.2s ease;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #updateBtn {
            background: #38bdf8;
            color: #010816;
        }

        #updateBtn:hover {
            background: #7dd3fc;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        #clearBtn {
            background: #ef4444;
            color: #fff;
        }

        #clearBtn:hover {
            background: #f87171;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .status-header {
            margin: 0 0 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #1e293b;
        }

        .badge {
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(56, 189, 248, 0.1);
        }

        .footer {
            font-size: 10px;
            color: #64748b;
            text-align: center;
            margin-top: 15px;
            border-top: 1px solid #1e293b;
            padding-top: 10px;
        }

        .hint {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 10px;
            font-style: italic;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="panel">
        <div class="status-header">
            <h2 id="uiTitle" style="margin:0; font-size: 18px;">Shield <span class="neon-text">PRO</span></h2>
            <span id="verText" style="font-size: 10px; opacity: 0.6;">v9.0.0</span>
        </div>

        <div class="status-row">
            <span>Status silnika:</span>
            <span id="statusBadge" class="badge" style="color: #22c55e;">OCHRONA AKTYWNA</span>
        </div>

        <div class="status-row">
            <span>Tryb Stealth:</span>
            <span style="color: #38bdf8; font-weight: bold;">WŁĄCZONY</span>
        </div>

        <div class="status-row" style="border:none;">
            <span>Integracja AI:</span>
            <span style="color: #a855f7; font-weight: bold;">GOTOOWY</span>
        </div>

        <button id="updateBtn" class="btn">Pobierz Update z GitHub</button>
        <button id="clearBtn" class="btn">Wyczyść Sesję (Anti-Detect)</button>

        <div class="hint">
            💡 CTRL+Klik = Google | ALT+Klik = AI Szukaj
        </div>

        <div class="footer">
            <p>Created by Mikuś | GitHub: Mi1ku</p>
        </div>
    </div>
    <script src="popup.js"></script>
</body>

</html>

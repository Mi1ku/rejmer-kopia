<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 340px;
            background: #08080a;
            color: #e2e8f0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 15px;
            margin: 0;
            overflow: hidden;
        }

        .panel {
            border: 1px solid #1e293b;
            border-radius: 12px;
            background: #0f172a;
            padding: 15px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .neon-text {
            color: #38bdf8;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
            font-weight: 800;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.2s ease;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #updateBtn {
            background: #38bdf8;
            color: #010816;
        }

        #clearBtn {
            background: #ef4444;
            color: #fff;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .status-header {
            margin: 0 0 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #1e293b;
        }

        .badge {
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(56, 189, 248, 0.1);
        }

        .footer {
            font-size: 10px;
            color: #64748b;
            text-align: center;
            margin-top: 15px;
            border-top: 1px solid #1e293b;
            padding-top: 10px;
        }

        /* LOCK SCREEN STYLES */
        #lockScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.98);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
            backdrop-filter: blur(4px);
        }

        .lock-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 10px;
            color: #ef4444;
        }

        .lock-desc {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .input-key {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 10px;
            color: #fff;
            width: 80%;
            text-align: center;
            margin-bottom: 10px;
            outline: none;
        }

        .buy-link {
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
            font-size: 11px;
            margin-top: 15px;
            transition: 0.3s;
        }

        .buy-link:hover {
            text-decoration: underline;
            color: #7dd3fc;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <div class="panel">
        <!-- LOCK OVERLAY -->
        <div id="lockScreen">
            <div class="lock-title">DOSTĘP ZABLOKOWANY</div>
            <div class="lock-desc">
                Wymagany jest klucz licencyjny do aktywacji Shield Ultra.<br><br>
                Kup klucz w wiadomości PV:<br>
                <a href="https://www.instagram.com/76mikus/" target="_blank" class="buy-link"
                    style="font-size: 13px;">Instagram: @76_mikus</a><br>
                <a href="https://github.com/Mi1ku" target="_blank" class="buy-link">GitHub: Mi1ku</a>
            </div>
            <input type="text" id="licenseInput" class="input-key" placeholder="Wpisz klucz (NP: TRIAL-2026)">
            <button id="activateBtn" class="btn" style="background: #22c55e; color: #052e16;">Aktywuj Silnik</button>
        </div>

        <!-- MAIN UI -->
        <div id="mainUI" class="hidden">
            <div class="status-header">
                <h2 id="uiTitle" style="margin:0; font-size: 18px;">Shield <span class="neon-text">PRO</span></h2>
                <span id="verText" style="font-size: 10px; opacity: 0.6;">v4.0.0</span>
            </div>
            <div class="status-row"><span>Status:</span> <span id="statusBadge" class="badge"
                    style="color: #22c55e;">OCHRONA AKTYWNA</span></div>
            <div class="status-row"><span>Licencja:</span> <span id="licType"
                    style="color: #38bdf8; font-weight: bold;">PREMIUM</span></div>

            <button id="updateBtn" class="btn">Pobierz Update z GitHub</button>
            <button id="clearBtn" class="btn">Wyczyść Sesję (Anti-Detect)</button>
            <div class="footer">
                <p>Created by Mikus | Version Professional</p>
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
